<section class="portfolio" id="portfolio">

      <button class="chip" data-filter="wedding" aria-pressed="false">Wedding</button>
      <button class="chip" data-filter="prewedding" aria-pressed="false">Pre & post wedding</button>

      <button class="chip" data-filter="baby" aria-pressed="false">Baby</button>

  </div>

    <figure data-cat="baby"><img src="images/baby-bear.jpg" alt="Baby in a teddy-bear suit on a white blanket" loading="lazy"></figure>

    <figure data-cat="model"><img src="images/model-golden.jpg" alt="Model in a striped shirt at golden hour" loading="lazy"></figure>
    <figure data-cat="wedding"><img src="images/wedding-aisle.jpg" alt="Couple walking down the aisle as guests throw petals" loading="lazy"></figure>
    <figure data-cat="prewedding"><img src="images/prewed-arch.jpg" alt="Floral wedding arch with draped fabric" loading="lazy"></figure>

    <figure data-cat="model"><img src="images/model-street.jpg" alt="Smiling model in a denim jacket against a blue wall" loading="lazy"></figure>
    <figure data-cat="wedding"><img src="images/wedding-hands.jpg" alt="Bride and groom's hands with rings and bouquet" loading="lazy"></figure>
